  <!--
    The Sozo mark, traced from the shipped app icon and re-cut as a single
    path: the raster is a textured, anti-aliased 512px PNG that goes soft the
    moment it is scaled, and this is drawn at whatever size it is asked for.

    currentColor rather than a baked fill, so the same file serves the splash,
    the mode switch and anything tinted by the accent the user picked. A file
    with the red inside it would need a second copy the day somebody changes
    the accent.
