<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    The Sozo mark, cut into the parts an animation needs. The silhouette is
    byte-for-byte the shipped one: this file adds nothing to the brand and
    takes nothing away from it.

    The shipped mark is a single closed contour traced from the app icon, and
    that is the whole reason every attempt to animate it came out as a neon
    tube lighting up. There is nothing INSIDE a silhouette. A pen given only an
    outline can ring the letter; it cannot write it, because writing means
    travelling the stroke, not its edge.

    So the mark now carries its own centreline. It was not drawn by eye — it is
    derived from the outline: every sample on the edge is paired with the point
    directly across the ribbon (the nearest sample that is not its neighbour),
    and the midpoints of those pairs ARE the stroke's path. Median ribbon width
    measured 61 units in this 512 box, and the spine is 584 units long against
    a 1472-unit outline, which is the ratio a single-stroke letter should have.

    Both paint in `currentColor`, so one file serves the splash, the mode
    switch and anything tinted by whatever accent the user picked — a file with
    the red baked in would need a second copy the day somebody changes it.

    ## For anything that draws this

      #body   the fill. Closed, even-odd, identical to sozo_mark.svg.
      #spine  an OPEN path down the middle of the ribbon, written top-right to
              bottom-left — the direction the letter is drawn by hand. Never
              filled. It is a track: for a pen, for a highlight travelling the
              stroke, for the centre a flood spreads out from.
  -->
