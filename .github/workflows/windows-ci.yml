name: Windows build

# ci.yml builds Android and Linux but not Windows, so when #46 (2026-11-10)
# broke the Windows build, nothing caught it until two releases shipped
# without Windows. This runs only on changes that can break the Windows
# build, because a Windows runner costs twice as much as a Linux one.
on:
  pull_request:
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'windows/**'
      - 'assets/shaders/**'
      - '.github/workflows/windows-ci.yml'
  push:
    branches: [master]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'windows/**'
      - 'assets/shaders/**'
      - '.github/workflows/windows-ci.yml'
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Same as release.yml's windows job.
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Ensure NuGet (flutter_inappwebview_windows fetches WebView2 with it)
        uses: NuGet/setup-nuget@v2
      - name: Empty .env (a pubspec asset; the build fails without it)
        shell: bash
        run: touch .env
      - run: flutter pub get
      - run: flutter build windows --release
