name: 🐛 Bug report / Xato haqida xabar
description: Something in the app is not working / Ilovada biror narsa noto'g'ri ishlayapti
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        You can write in English or Uzbek. / Inglizcha yoki o'zbekcha yozishingiz mumkin.

        If one source is failing, use **🔌 Source not working** instead. It asks more precise questions.
        Muammo bitta manbada bo'lsa, **🔌 Manba ishlamayapti** shablonidan foydalaning.

  - type: textarea
    id: what
    attributes:
      label: What happened? / Nima bo'ldi?
      description: What you expected, and what happened instead / Nima kutgan edingiz va aslida nima bo'ldi
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Qanday takrorlash mumkin?
      placeholder: |
        1. Open the home page
        2. Tap "..."
        3. ...
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshot or video / Skrinshot yoki video
      description: Optional, but it often makes the fix much faster / Ixtiyoriy, lekin muammoni ancha tez hal qiladi

  - type: input
    id: version
    attributes:
      label: Sozo version / Sozo versiyasi
      description: Shown at the bottom of the Profile page / Profil sahifasining pastida yozilgan
      placeholder: "3.2.0+8"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform / Platforma
      options: [Android, Android TV, Apple TV, iOS, Windows, Linux, macOS]
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS version / Qurilma va OS versiyasi
      placeholder: "Pixel 7, Android 15"
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Player engine, if this is about playback / Pleyer dvigateli (agar pleyerga tegishli bo'lsa)
      description: Profile → Player settings / Profil → Pleyer sozlamalari
      options: ["Not sure or not relevant / Bilmayman yoki tegishli emas", "Native (default)", "media_kit"]
