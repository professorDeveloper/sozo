name: 🔌 Source not working / Manba ishlamayapti
description: A source or extension will not search or play / Manba qidirmayapti yoki video ochilmayapti
title: "[Source] "
labels: ["source"]
body:
  - type: markdown
    attributes:
      value: |
        You can write in English or Uzbek. / Inglizcha yoki o'zbekcha yozishingiz mumkin.

        These problems usually come from the site itself: a new domain, a changed page or a deleted file.
        We cannot check it without the details below, so please fill in everything.
        Iltimos, hamma maydonni to'ldiring: ularsiz muammoni tekshirib bo'lmaydi.

  - type: input
    id: source
    attributes:
      label: Which source? / Qaysi manba?
      description: The name shown in the app / Ilovadagi nomi bilan yozing
      placeholder: "4khdhub / hdhub4u / Aniyomi — AllAnime / ..."
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Where does it fail? / Qaysi bosqichda uziladi?
      options:
        - Search finds nothing / Qidiruv hech narsa topmayapti
        - Home page is empty / Bosh sahifa bo'sh
        - Detail page will not open / Batafsil sahifa ochilmayapti
        - Episode list is empty / Epizodlar ro'yxati bo'sh
        - No quality options / Sifat variantlari chiqmayapti
        - Video will not start or keeps loading / Video ochilmayapti yoki doim yuklanyapti
        - Video plays with a broken picture or no sound / Rasm buzuq yoki ovoz yo'q
        - Other / Boshqa
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Which title? / Qaysi kontentda?
      description: One broken title and a dead source are different problems / Aniq nomni yozing
      placeholder: "The Whisper Man (2026)"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened? / Nima bo'ldi?
      description: Copy the exact error from the screen. A screenshot helps too. / Xatoni aynan ko'chiring, skrinshot ham foydali.
    validations:
      required: true

  - type: dropdown
    id: everything
    attributes:
      label: Do other sources work? / Boshqa manbalar ishlayaptimi?
      description: This separates a source problem from a network or app problem / Muammo manbadami yoki tarmoqdami, shuni ajratadi
      options:
        - Yes, only this source fails / Ha, faqat shu manba ishlamayapti
        - No, none of them work / Yo'q, hech qaysi manba ishlamayapti
        - Did not check / Tekshirmadim
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Sozo version / Sozo versiyasi
      description: Shown at the bottom of the Profile page / Profil sahifasining pastida yozilgan
      placeholder: "3.2.0+8"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS / Qurilma va OS
      placeholder: "Samsung A54, Android 14 / Windows 11 / Android TV box"
    validations:
      required: true
