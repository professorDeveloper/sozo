# The package name stays `soplay` — it is the prefix of every `package:soplay/…`
# import in 600+ files and of the Android applicationId already installed on
# users' devices. Renaming it would be a rename of the app on disk, not of the
# brand. The brand lives in the Android/iOS app label and in `Sozo` everywhere
# a person can see it.
name: soplay
description: "Sozo — kino, serial, anime, manga va light novellalar uchun ochiq kodli Flutter ilovasi."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 3.0.2+5

environment:
  sdk: ^3.11.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  # State Management
  cupertino_icons: ^1.0.8
  animated_text_kit: ^4.3.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  package_info_plus: ^8.1.2

  # Dependency Injection
  get_it: ^8.0.3

  # Navigation
  go_router: ^14.8.1

  # Network
  dio: ^5.8.0+1
  dio_cookie_manager: ^3.2.0
  cookie_jar: ^4.0.8
  # Watch2Gether real-time sync (backend: socket.io v4, namespace /watch)
  socket_io_client: ^3.1.6


  # Firebase / Push
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Local Storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Security
  crypto: ^3.0.6
  local_auth: ^2.3.0

  # Localization
  easy_localization: ^3.0.7

  # Functional programming
  dartz: ^0.10.1
  json_annotation: ^4.11.0

  # UI
  shimmer: ^3.0.0
  flutter_svg: ^2.0.3
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  scrollable_positioned_list: ^0.3.8
  palette_generator: ^0.3.3+5
  video_player: ^2.9.5
  # Desktop (Windows/Linux/macOS) video playback via libmpv. Mobile keeps the
  # native video_player backend untouched — see core/player/media_controller.dart.
  # Windows-only libs package so Android/iOS builds don't pull in libmpv.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.11
  # Android libmpv, shipped so the opt-in "media_kit" playback engine
  # (Settings → Player) can do audio-track switching. Adds native .so payload to
  # every Android ABI — see the size note in .github/workflows/release.yml.
  media_kit_libs_android_video: ^1.3.6
  flutter_inappwebview: ^6.1.5
  wakelock_plus: ^1.2.10
  floating: ^6.0.0
  # Desktop window control (true fullscreen that hides the taskbar) for the
  # player. Desktop-only plugin; unused on Android/iOS.
  window_manager: ^0.4.3
  showcaseview: ^5.0.2
  share_plus: ^10.1.4
  app_links: ^6.3.2
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  flutter_html: ^3.0.0-beta.2
  markdown: ^7.3.0
  flutter_dotenv: ^5.2.1
  # Product analytics. Chosen over Firebase Analytics — already a dependency —
  # because the questions here are behavioural funnels ("how many people who
  # search actually play something"), which Firebase answers only after a
  # BigQuery export, and Amplitude answers in its own UI.
  amplitude_flutter: ^4.7.1
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_linux: ^1.2.1
  liquid_glass_widgets: ^0.18.4
  mobile_scanner: ^7.4.0
  firebase_auth: ^5.7.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3

  # Torrent indexers. Nyaa, Sukebei and Tokyo Toshokan publish RSS, so the
  # torrent search needs a real XML parser -- already in the lockfile
  # transitively. The HTML-only trackers are parsed magnet-first with regex
  # instead: they are Nuxt apps whose class names are utility soup, and an
  # anchor on `href="magnet:"` survives a redesign that CSS selectors do not.
  xml: ^6.6.1
  # Trailer playback without a YouTube iframe. TrailerService resolves a title
  # to a YouTube video id, then this resolves that id to a direct muxed
  # (video+audio) URL the app's own player can open. Pure Dart, no API key and
  # no native dependency — the alternative was a WebView showing YouTube's own
  # chrome, ads and "watch on YouTube" button inside our detail page.
  # Pinned to the 3.x line deliberately. YouTube rotates its player cipher
  # every few weeks and only the newest release of this package keeps up; an
  # older one fails to resolve a stream at all, which looks exactly like "the
  # trailer button is broken".
  youtube_explode_dart: ^3.1.0

  # Save a frame from the player to the device gallery (Android MediaStore /
  # iOS Photos). One tap, and the thing people were going to screenshot badly
  # with the system shortcut — with our controls burned into it — comes out
  # clean at the video's own resolution.
  gal: ^2.3.0
  file_picker: ^11.0.3
  speech_to_text: ^7.4.0
  adaptive_platform_ui: ^0.1.111
  dart_cast: ^0.7.4
  connectivity_plus: ^7.3.1

  # Discord Rich Presence on mobile, where there is no Discord client to reach
  # over a local socket. Already in the lockfile transitively; declared because
  # this now depends on it directly.
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  json_serializable: ^6.13.1
  build_runner: ^2.14.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  assets:
    - assets/translations/
    - assets/icons/
    - assets/brand/
    - assets/onboarding/
    - assets/onboarding/channels/
    - assets/js/
    - .env
